<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Becoming Iconic</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Raleway:wght@400;700&family=Allura&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Raleway', sans-serif; }
    button { font-family: inherit; cursor: pointer; }
    .btn { padding: 12px 24px; border-radius: 12px; border: none; font-weight: 700; transition: all 0.2s; }
    .btn:hover { transform: scale(1.05); }
  </style>
  <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState } = React;

    const seasonColors = ['#AA23FF', '#026820', '#FD5E53', '#0CAFE3', '#FD3DB5', '#71D9E2'];
    const pillarColors = {
      'Personal Development': '#8ED7F6', 'Physical Health': '#00BB77',
      'Career/Financial': '#FF8C00', 'Relationships': '#FD1564',
      'Skills & Knowledge': '#BD69BE', 'Spiritual/Emotional': '#BFFE28'
    };

    const masterTimeline = {
      series1: { name: "Becoming Iconic", seasons: [
        { id: 1, name: "Foundation", years: "2026-2027", surface: "Career & Financial Success", 
          strategic: "Establishing credibility, building village, creating financial infrastructure",
          warRoom: "Phase 1: Become someone worth listening to. Prove you can operate in their system. Fund the real mission." },
        { id: 2, name: "Partnership", years: "2028-TBD", surface: "Wedding Planning & Relationship",
          strategic: "Strategic partnership formation, social media platform launch, expanding influence",
          warRoom: "Phase 2: Establish life partnership as operational foundation. Build public platform." },
        { id: 3, name: "Access", years: "TBD", surface: "Travel & Experience",
          strategic: "Breaking into elite circles, building credibility with power holders",
          warRoom: "Phase 3: Infiltrate the rooms where decisions are made. Document everything for the masses." }
      ]},
      series2: { name: "Being Iconic", seasons: [
        { id: 4, name: "Legacy", years: "TBD", surface: "Motherhood & Family",
          strategic: "Creating next generation, continuing platform growth",
          warRoom: "Phase 4: Raise the next generation within the new paradigm." },
        { id: 5, name: "Positioning", years: "TBD", surface: "Motherhood & Personal Growth",
          strategic: "Setting pieces in motion, building political/social infrastructure",
          warRoom: "Phase 5: Begin the Rube Goldberg. Plant seeds for systemic change." },
        { id: 6, name: "Execution", years: "TBD", surface: "Leadership & Impact",
          strategic: "Major structural changes, system transformation",
          warRoom: "Phase 6: Rebuild the American Governmental Machine. Decenter patriarchy." }
      ]}
    };

    const App = () => {
      const [view, setView] = useState('master');
      const [season, setSeason] = useState(1);
      const [year, setYear] = useState(2026);
      const [quarter, setQuarter] = useState(1);
      const [month, setMonth] = useState(1);
      const [week, setWeek] = useState(1);
      const [reveal, setReveal] = useState('green');
      const [notes, setNotes] = useState({'1-Wednesday': "Claude really is the AI for creatives.... I love it here!"});
      const [editing, setEditing] = useState(null);
      const [temp, setTemp] = useState('');

      const allSeasons = [...masterTimeline.series1.seasons, ...masterTimeline.series2.seasons];
      const currentSeason = allSeasons.find(s => s.id === season);

      const weeks = [
        { week: 1, start: "Dec 28, 2025", end: "Jan 3, 2026", hotLeads: 2, presentations: 1, proposals: 0, theme: "Getting Started", month: 1 },
        { week: 2, start: "Jan 4", end: "Jan 10", hotLeads: 2, presentations: 1, proposals: 0, theme: "Building Confidence", month: 1 },
        { week: 3, start: "Jan 11", end: "Jan 17", hotLeads: 3, presentations: 1, proposals: 1, theme: "First Proposal", month: 1 },
        { week: 4, start: "Jan 18", end: "Jan 24", hotLeads: 3, presentations: 2, proposals: 1, theme: "Momentum Building", month: 1 },
        { week: 5, start: "Jan 25", end: "Jan 31", hotLeads: 3, presentations: 2, proposals: 1, theme: "Consistency", month: 1 },
        { week: 6, start: "Feb 1", end: "Feb 7", hotLeads: 4, presentations: 2, proposals: 1, theme: "Scaling Up", month: 2 },
        { week: 7, start: "Feb 8", end: "Feb 14", hotLeads: 4, presentations: 2, proposals: 2, theme: "Full Pipeline", month: 2 },
        { week: 8, start: "Feb 15", end: "Feb 21", hotLeads: 4, presentations: 3, proposals: 2, theme: "Conversion Focus", month: 2 },
        { week: 9, start: "Feb 22", end: "Feb 28", hotLeads: 5, presentations: 3, proposals: 2, theme: "Target Achievement", month: 2 },
        { week: 10, start: "Mar 1", end: "Mar 7", hotLeads: 5, presentations: 3, proposals: 2, theme: "Sustained Excellence", month: 3 },
        { week: 11, start: "Mar 8", end: "Mar 14", hotLeads: 5, presentations: 3, proposals: 2, theme: "Refinement", month: 3 },
        { week: 12, start: "Mar 15", end: "Mar 21", hotLeads: 5, presentations: 3, proposals: 2, theme: "Foundation Complete", month: 3 }
      ];

      const framework = {
        Sunday: { theme: "Restoration", focus: "Rest, inspiration, vision alignment", energy: "Renewal" },
        Monday: { theme: "Momentum", focus: "Sales prospecting & outreach", energy: "High action" },
        Tuesday: { theme: "Connection", focus: "Presentations & relationship building", energy: "Interpersonal" },
        Wednesday: { theme: "Creation", focus: "Proposals, content, skill development", energy: "Deep work" },
        Thursday: { theme: "Growth", focus: "Learning, training, personal development", energy: "Expansion" },
        Friday: { theme: "Follow-up", focus: "Pipeline management & planning", energy: "Completion" },
        Saturday: { theme: "Integration", focus: "Reflection, character mapping, storyboarding", energy: "Strategic" }
      };

      const pillars = [
        { pillar: "Personal Development", current: 20 }, { pillar: "Physical Health", current: 15 },
        { pillar: "Career/Financial", current: 25 }, { pillar: "Relationships", current: 10 },
        { pillar: "Skills & Knowledge", current: 20 }, { pillar: "Spiritual/Emotional", current: 15 }
      ];

      const months = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];

      const genCal = (y, m) => {
        const first = new Date(y, m - 1, 1).getDay();
        const days = new Date(y, m, 0).getDate();
        const cal = [];
        let w = Array(7).fill(null);
        for (let d = 1; d <= days; d++) {
          w[(first + d - 1) % 7] = d;
          if ((first + d - 1) % 7 === 6 || d === days) {
            cal.push([...w]);
            w = Array(7).fill(null);
          }
        }
        return cal;
      };

      const Card = ({children, color, onClick}) => (
        <div onClick={onClick} style={{
          background: 'white', borderRadius: '16px', padding: '24px',
          border: `3px solid ${color || seasonColors[season-1]}`,
          boxShadow: `0 0 20px ${(color || seasonColors[season-1])}40`,
          cursor: onClick ? 'pointer' : 'default', transition: 'all 0.3s'
        }}>{children}</div>
      );

      const Breadcrumb = () => {
        const crumbs = [{l: 'Master', v: 'master'}];
        if (view !== 'master') crumbs.push({l: `Season ${season}`, v: 'season'});
        if (['year','quarter','month','week'].includes(view)) crumbs.push({l: year, v: 'year'});
        if (['quarter','month','week'].includes(view)) crumbs.push({l: `Q${quarter}`, v: 'quarter'});
        if (['month','week'].includes(view)) crumbs.push({l: months[month-1], v: 'month'});
        if (view === 'week') crumbs.push({l: `Week ${week}`, v: 'week'});
        return (
          <div style={{display:'flex', gap:'8px', marginBottom:'24px', flexWrap:'wrap'}}>
            {crumbs.map((c,i) => (
              <React.Fragment key={i}>
                {i>0 && <span>›</span>}
                <button onClick={() => setView(c.v)} style={{
                  background:'none', border:'none', color:seasonColors[season-1],
                  fontWeight:700, fontSize:'16px'
                }}>{c.l}</button>
              </React.Fragment>
            ))}
          </div>
        );
      };

      return (
        <div style={{
          minHeight:'100vh', padding:'32px',
          background:'linear-gradient(135deg, #E6E6FA 0%, #FFC0CB 50%, #98D8C8 100%)'
        }}>
          {/* Security Toggle */}
          <div style={{
            position:'fixed', top:'16px', right:'16px', zIndex:50,
            background:'rgba(255,255,255,0.9)', borderRadius:'16px',
            padding:'16px', boxShadow:'0 0 30px rgba(170,35,255,0.3)'
          }}>
            <div style={{fontSize:'12px', fontWeight:900, marginBottom:'8px'}}>SECURITY</div>
            <div style={{display:'flex', gap:'8px'}}>
              {[{l:'green',c:'#00BB77'},{l:'yellow',c:'#FF8C00'},{l:'red',c:'#FD1564'}].map(({l,c}) => (
                <button key={l} onClick={() => setReveal(l)} style={{
                  width:'40px', height:'40px', borderRadius:'50%',
                  border:`3px solid ${c}`, background: reveal===l ? c : `${c}40`,
                  transform: reveal===l ? 'scale(1.2)' : 'scale(1)'
                }} />
              ))}
            </div>
          </div>

          {/* Header */}
          <div style={{
            background:'rgba(255,255,255,0.95)', borderRadius:'24px',
            padding:'40px', marginBottom:'32px',
            boxShadow:'0 0 60px rgba(170,35,255,0.4)'
          }}>
            <h1 style={{
              fontSize:'48px', fontFamily:'Montserrat', fontWeight:900,
              background:`linear-gradient(135deg, ${seasonColors[0]}, ${seasonColors[2]}, ${seasonColors[5]})`,
              WebkitBackgroundClip:'text', WebkitTextFillColor:'transparent'
            }}>Becoming Iconic</h1>
            <p style={{fontSize:'24px', fontFamily:'Allura', color:seasonColors[season-1]}}>
              {reveal==='green' && 'Personal Transformation Dashboard'}
              {reveal==='yellow' && 'Strategic Operations Center'}
              {reveal==='red' && 'Mission Control: Rebuilding the System'}
            </p>
          </div>

          <Breadcrumb />

          {/* MASTER VIEW */}
          {view === 'master' && (
            <div style={{background:'rgba(255,255,255,0.95)', borderRadius:'24px', padding:'32px'}}>
              <h2 style={{fontSize:'32px', fontFamily:'Montserrat', fontWeight:900, marginBottom:'24px'}}>
                Complete Operations Map
              </h2>
              {[masterTimeline.series1, masterTimeline.series2].map((series, idx) => (
                <div key={idx} style={{marginBottom:'32px'}}>
                  <h3 style={{
                    fontSize:'24px', fontFamily:'Montserrat', fontWeight:900,
                    color:seasonColors[idx*3], marginBottom:'16px'
                  }}>{series.name}</h3>
                  {series.seasons.map(s => (
                    <Card key={s.id} color={seasonColors[s.id-1]} onClick={() => {setSeason(s.id); setView('season')}}>
                      <h4 style={{fontSize:'20px', fontFamily:'Montserrat', fontWeight:900, marginBottom:'8px'}}>
                        Season {s.id}: {s.name}
                      </h4>
                      <p style={{fontSize:'14px', color:'#666', marginBottom:'8px'}}>{s.years}</p>
                      <p><strong>Surface:</strong> {s.surface}</p>
                      {reveal !== 'green' && <p style={{color:'#0CAFE3', marginTop:'8px'}}>
                        <strong>Strategic:</strong> {s.strategic}
                      </p>}
                      {reveal === 'red' && <p style={{color:'#FD1564', marginTop:'8px', fontWeight:700}}>
                        <strong>War Room:</strong> {s.warRoom}
                      </p>}
                    </Card>
                  ))}
                </div>
              ))}
            </div>
          )}

          {/* SEASON VIEW */}
          {view === 'season' && (
            <Card color={seasonColors[season-1]}>
              <h2 style={{fontSize:'32px', fontFamily:'Montserrat', fontWeight:900, marginBottom:'16px'}}>
                Season {currentSeason.id}: {currentSeason.name}
              </h2>
              <p style={{color:'#666', marginBottom:'16px'}}>{currentSeason.years}</p>
              <div style={{padding:'16px', background:`${seasonColors[season-1]}15`, borderRadius:'12px', marginBottom:'12px'}}>
                <strong>Surface:</strong> {currentSeason.surface}
              </div>
              {reveal !== 'green' && (
                <div style={{padding:'16px', background:'#0CAFE320', borderRadius:'12px', marginBottom:'12px'}}>
                  <strong>Strategic:</strong> {currentSeason.strategic}
                </div>
              )}
              {reveal === 'red' && (
                <div style={{padding:'16px', background:'#FD156420', borderRadius:'12px', marginBottom:'16px'}}>
                  <strong>War Room:</strong> {currentSeason.warRoom}
                </div>
              )}
              {season === 1 && (
                <div style={{marginTop:'24px'}}>
                  <h3 style={{fontFamily:'Montserrat', fontWeight:900, marginBottom:'12px'}}>Navigate to Year:</h3>
                  <div style={{display:'flex', gap:'12px'}}>
                    {[2026, 2027].map(y => (
                      <button key={y} onClick={() => {setYear(y); setView('year')}} className="btn" style={{
                        background:seasonColors[season-1], color:'white'
                      }}>{y}</button>
                    ))}
                  </div>
                </div>
              )}
            </Card>
          )}

          {/* YEAR VIEW */}
          {view === 'year' && (
            <Card>
              <h2 style={{fontSize:'32px', fontFamily:'Montserrat', fontWeight:900, marginBottom:'24px'}}>{year}</h2>
              <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(200px, 1fr))', gap:'16px'}}>
                {[1,2,3,4].map(q => (
                  <button key={q} onClick={() => {setQuarter(q); setView('quarter')}} className="btn" style={{
                    background:'white', border:`3px solid ${seasonColors[q-1]}`,
                    padding:'24px', fontSize:'20px', fontWeight:900
                  }}>Q{q}</button>
                ))}
              </div>
            </Card>
          )}

          {/* QUARTER VIEW */}
          {view === 'quarter' && (
            <Card>
              <h2 style={{fontSize:'32px', fontFamily:'Montserrat', fontWeight:900, marginBottom:'24px'}}>
                Q{quarter} {year}
              </h2>
              <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(250px, 1fr))', gap:'16px'}}>
                {[0,1,2].map(i => {
                  const m = (quarter-1)*3 + i + 1;
                  const cal = genCal(year, m);
                  return (
                    <div key={m} style={{
                      border:`3px solid ${seasonColors[quarter-1]}`, borderRadius:'12px',
                      padding:'16px', background:'white'
                    }}>
                      <h3 style={{textAlign:'center', fontWeight:900, marginBottom:'12px'}}>{months[m-1]}</h3>
                      <div style={{display:'grid', gridTemplateColumns:'repeat(7, 1fr)', gap:'4px'}}>
                        {['Su','Mo','Tu','We','Th','Fr','Sa'].map(d => (
                          <div key={d} style={{textAlign:'center', fontSize:'12px', fontWeight:700}}>{d}</div>
                        ))}
                        {cal.map((w, wi) => w.map((d, di) => (
                          <button key={`${wi}-${di}`} onClick={() => {if(d){setMonth(m); setView('month')}}} style={{
                            padding:'8px', background: d ? `${seasonColors[quarter-1]}20` : 'transparent',
                            border:'none', borderRadius:'4px', fontSize:'14px', fontWeight:700,
                            color: d ? seasonColors[quarter-1] : 'transparent'
                          }}>{d||'0'}</button>
                        )))}
                      </div>
                    </div>
                  );
                })}
              </div>
            </Card>
          )}

          {/* MONTH VIEW */}
          {view === 'month' && (
            <Card>
              <h2 style={{fontSize:'32px', fontFamily:'Montserrat', fontWeight:900, marginBottom:'24px'}}>
                {months[month-1]} {year}
              </h2>
              <div style={{marginBottom:'24px'}}>
                <div style={{display:'grid', gridTemplateColumns:'repeat(7, 1fr)', gap:'8px'}}>
                  {['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'].map(d => (
                    <div key={d} style={{textAlign:'center', fontWeight:900, padding:'8px'}}>{d}</div>
                  ))}
                  {genCal(year, month).map((w, wi) => w.map((d, di) => (
                    <div key={`${wi}-${di}`} style={{
                      minHeight:'60px', padding:'8px', background: d ? 'white' : '#f5f5f5',
                      border: d ? `2px solid ${seasonColors[season-1]}` : 'none',
                      borderRadius:'8px', fontSize:'18px', fontWeight:700,
                      color: d ? seasonColors[season-1] : 'transparent'
                    }}>{d||'0'}</div>
                  )))}
                </div>
              </div>
              <div>
                <h3 style={{fontFamily:'Montserrat', fontWeight:900, marginBottom:'12px'}}>
                  Weeks in {months[month-1]}
                </h3>
                {weeks.filter(w => w.month === month).map(w => (
                  <Card key={w.week} color={seasonColors[season-1]} onClick={() => {setWeek(w.week); setView('week')}}>
                    <h4 style={{fontSize:'18px', fontWeight:900}}>Week {w.week}: {w.theme}</h4>
                    <p style={{fontSize:'14px', color:'#666'}}>{w.start} - {w.end}</p>
                    {reveal !== 'green' && (
                      <div style={{marginTop:'8px', display:'flex', gap:'16px', fontSize:'14px'}}>
                        <span>Leads: {w.hotLeads}</span>
                        <span>Presentations: {w.presentations}</span>
                        <span>Proposals: {w.proposals}</span>
                      </div>
                    )}
                  </Card>
                ))}
              </div>
            </Card>
          )}

          {/* WEEK VIEW */}
          {view === 'week' && (() => {
            const w = weeks[week-1];
            const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
            // Calculate actual dates for this week
            const calcDates = () => {
              const startStr = w.start.includes(',') ? w.start : `${w.start}, 2026`;
              const startDate = new Date(startStr);
              return days.map((_, i) => {
                const d = new Date(startDate);
                d.setDate(startDate.getDate() + i);
                const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
                return `${months[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
              });
            };
            const dates = calcDates();
            return (
              <Card>
                <h2 style={{fontSize:'32px', fontFamily:'Montserrat', fontWeight:900, marginBottom:'8px'}}>
                  Week {w.week}: {w.theme}
                </h2>
                <p style={{fontSize:'18px', color:'#666', marginBottom:'24px'}}>{w.start} - {w.end}</p>
                {reveal !== 'green' && (
                  <div style={{display:'grid', gridTemplateColumns:'repeat(auto-fit, minmax(200px, 1fr))', gap:'16px', marginBottom:'24px'}}>
                    {[{l:'Hot Leads', v:w.hotLeads, c:seasonColors[0]}, {l:'Presentations', v:w.presentations, c:seasonColors[3]}, {l:'Proposals', v:w.proposals, c:seasonColors[4]}].map(({l,v,c}) => (
                      <div key={l} style={{padding:'16px', background:`${c}20`, borderLeft:`6px solid ${c}`, borderRadius:'12px'}}>
                        <div style={{fontSize:'14px', fontWeight:900, marginBottom:'4px'}}>{l}</div>
                        <div style={{fontSize:'36px', fontWeight:900, color:c}}>{v}</div>
                      </div>
                    ))}
                  </div>
                )}
                <h3 style={{fontSize:'24px', fontFamily:'Montserrat', fontWeight:900, marginBottom:'16px'}}>Daily Tracking</h3>
                {days.map((d, i) => {
                  const f = framework[d];
                  const key = `${week}-${d}`;
                  const isEdit = editing === key;
                  return (
                    <div key={d} style={{
                      border:`3px solid ${seasonColors[season-1]}`, borderRadius:'12px',
                      padding:'16px', marginBottom:'12px', background:'white'
                    }}>
                      <div style={{display:'flex', justifyContent:'space-between', marginBottom:'12px'}}>
                        <div>
                          <h4 style={{fontSize:'20px', fontWeight:900, marginBottom:'4px'}}>
                            {d} — {dates[i]}
                          </h4>
                          <p style={{fontSize:'16px', fontFamily:'Allura', fontWeight:700}}>{f.theme}</p>
                        </div>
                        <button onClick={() => {
                          if(isEdit){setNotes(prev => ({...prev, [key]:temp})); setEditing(null); setTemp('');}
                          else{setEditing(key); setTemp(notes[key]||'');}
                        }} style={{padding:'8px', background:`${seasonColors[season-1]}20`, border:'none', borderRadius:'8px'}}>
                          {isEdit ? '✓' : '✎'}
                        </button>
                      </div>
                      <p style={{fontSize:'14px', color:'#666', marginBottom:'8px'}}>{f.focus}</p>
                      <span style={{
                        display:'inline-block', padding:'4px 12px', borderRadius:'999px',
                        background:`${seasonColors[season-1]}25`, fontSize:'12px', fontWeight:700,
                        marginBottom:'12px'
                      }}>{f.energy}</span>
                      {isEdit ? (
                        <textarea value={temp} onChange={e => setTemp(e.target.value)} style={{
                          width:'100%', padding:'12px', borderRadius:'8px',
                          border:`2px solid ${seasonColors[season-1]}`, fontSize:'14px', minHeight:'80px'
                        }} placeholder="Notes..." />
                      ) : (
                        <div style={{
                          padding:'12px', borderRadius:'8px', background:`${seasonColors[season-1]}10`,
                          minHeight:'60px', fontSize:'14px', whiteSpace:'pre-wrap'
                        }}>{notes[key] || 'No notes yet...'}</div>
                      )}
                    </div>
                  );
                })}
              </Card>
            );
          })()}

          {/* PILLARS */}
          <div style={{background:'rgba(255,255,255,0.95)', borderRadius:'24px', padding:'32px', marginTop:'32px'}}>
            <h2 style={{fontSize:'28px', fontFamily:'Montserrat', fontWeight:900, marginBottom:'8px'}}>
              Transformation Pillars
            </h2>
            <p style={{fontSize:'14px', color:'#888', marginBottom:'16px'}}>
              Baseline percentages - awaiting assessment data
            </p>
            {pillars.map(p => (
              <div key={p.pillar} style={{marginBottom:'16px'}}>
                <div style={{display:'flex', justifyContent:'space-between', marginBottom:'4px'}}>
                  <span style={{fontWeight:900, color:pillarColors[p.pillar]}}>{p.pillar}</span>
                  <span style={{fontWeight:900, color:pillarColors[p.pillar]}}>{p.current}%</span>
                </div>
                <div style={{width:'100%', height:'12px', background:'#e5e7eb', borderRadius:'999px', overflow:'hidden'}}>
                  <div style={{
                    height:'100%', width:`${p.current}%`, background:pillarColors[p.pillar],
                    boxShadow:`0 0 10px ${pillarColors[p.pillar]}60`, transition:'width 0.5s'
                  }} />
                </div>
              </div>
            ))}
          </div>
        </div>
      );
    };

    ReactDOM.render(<App />, document.getElementById('root'));
  </script>
</body>
</html>
